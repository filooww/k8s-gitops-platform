# Bitnami Sealed Secrets controller: lets us commit *encrypted* secrets to
# git (SealedSecret CRs) instead of plaintext Kubernetes Secrets. The
# controller holds the private key in-cluster and decrypts on the fly into a
# regular Secret that myapp consumes.
#
# sync-wave -1 so the CRD + controller land before `myapp`'s SealedSecret
# needs it (see argocd/apps/myapp.yaml, default wave 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.18.6
    helm:
      releaseName: sealed-secrets
      parameters:
        - name: fullnameOverride
          value: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
