alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"          
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: telegram    
          matchers:
            - namespace = "myapp"
          continue: false
        - receiver: telegram  
          matchers:
            - severity = "critical"
          repeat_interval: 1h
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token: "REPLACE_WITH_BOTFATHER_TOKEN"
            chat_id: 123456789
            parse_mode: HTML
            send_resolved: true
            message: |
              <b>{{ .Status | toUpper }}</b> · {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
