# SealedSecret (bitnami-labs/sealed-secrets) instead of a plain Secret: the
# ciphertext under encryptedData is safe to commit — only the controller's
# private key (kept in-cluster, see argocd/apps/sealed-secrets.yaml) can
# decrypt it. The controller watches this CR and materializes a real
# "{{ include "myapp.fullname" . }}-secret" Secret that the Deployment reads
# via envFrom. Reseal with `make seal KEY=... VALUE=...`.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "myapp.fullname" . }}-secret
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- range $k, $v := .Values.sealedSecret.encryptedData }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ include "myapp.fullname" . }}-secret
      labels:
        {{- include "myapp.labels" . | nindent 8 }}
    type: Opaque
